name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      # The site is served from the root of the custom domain (briancrisostomo.dev),
      # so no base path. configure-pages reports "/<repo>" here, which breaks every
      # asset URL. If the custom domain is ever removed, switch back to the
      # configure-pages output: steps.pages.outputs.base_path.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
